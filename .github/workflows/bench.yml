name: Bench

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Full main commit SHA for the Orion timing baseline
        required: true
        type: string
      at_desk:
        description: Orion is ready for the reference protocol with the owner at the desk
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  counts:
    name: Deterministic bench gate
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Lint the headless bench
        run: cargo clippy --locked -p omnia-bench --all-targets --features headless -- -D warnings
      - name: Lint and test the canvas with bench-paint-scopes off
        # Workspace builds unify the feature on through omnia-bench; build these alone so the
        # feature-off side of sheet.rs is compiled and checked too.
        run: |
          cargo clippy --locked -p omnia-canvas -p omnia-app --all-targets -- -D warnings
          cargo test --locked -p omnia-canvas
      - name: Build the headless bench
        run: cargo build --locked -p omnia-bench --features headless
      - name: Compare real-sheet counts
        run: ./bench-baseline/hosted.ps1
      - name: Retain benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-bench-reports
          path: target/bench-reports/

  reference:
    name: Orion frame-time comparison
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.at_desk
    runs-on: [self-hosted, linux, orion]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify baseline commit is on main
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          [[ $BASELINE_SHA =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
      - name: Build both revisions before the campaign
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          git archive --output "$RUNNER_TEMP/omnia-bench-base.tar" "$BASELINE_SHA"
          baseline=$(mktemp -d "$RUNNER_TEMP/omnia-bench-base.XXXXXXXX")
          tar -xf "$RUNNER_TEMP/omnia-bench-base.tar" -C "$baseline"
          (cd "$baseline" && cargo build --release --locked -p omnia-bench)
          cp "$CARGO_TARGET_DIR/release/omnia-bench" "$RUNNER_TEMP/omnia-bench-base"
          cargo build --release --locked -p omnia-bench
          cp "$CARGO_TARGET_DIR/release/omnia-bench" "$RUNNER_TEMP/omnia-bench-candidate"
      - name: Compare frame p99 on Orion
        run: |
          python3 bench-baseline/reference.py "$RUNNER_TEMP/omnia-bench-base" \
            "$RUNNER_TEMP/omnia-bench-candidate" "target/orion-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Retain comparison reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-frame-time-reports
          path: target/orion-${{ github.run_id }}-${{ github.run_attempt }}/
