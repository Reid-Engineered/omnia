# P0.3 spike PS1: expected extraction results for the 20 decks and the hostile set.
#
# `blocks` lists "<kind>:<name>" in emitted (flattened source) order; `lines` is the number
# of physical lines in the extracted text; `ports` is the `.subckt` port list.
# Fixed before the first run of the extractor. One correction after that run, logged in
# P0.3.md: 05-bjt-npn-generic NPN_GENERIC `lines` 7 -> 6 (a hand miscount of the fixture;
# the block is physical lines 4-9 of a 10-line file).

