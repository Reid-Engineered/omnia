[package]
name = "omnia-circuit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# context-plan.md section 5 & CINV1: GPUI-free, no async runtime, no omnia-agent,
# omnia-parts or omnia-sim.
[dependencies]
omnia-doc = { path = "../omnia-doc" }
omnia-symbols = { path = "../omnia-symbols" }
# Plan section 13 (MIT OR Apache-2.0); already in Cargo.lock.
rustc-hash = "2"
smallvec = "1"

[dev-dependencies]
proptest = "1"

[lints.clippy]
# CD7 / CINV10: reject all hash-map and hash-set iteration paths, including `for` loops.
iter_over_hash_type = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
