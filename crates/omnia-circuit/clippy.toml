# CD7 / CINV10: no hash-map or hash-set iteration anywhere in omnia-circuit.
# FxHashMap<K, V> is a type alias for std::collections::HashMap<K, V, FxBuildHasher>,
# so disallowing std::collections::HashMap and HashSet iteration methods and iterator
# types covers both.
disallowed-methods = [
    { path = "std::collections::HashMap::iter", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::iter_mut", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::keys", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::values", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::values_mut", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::into_keys", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::into_values", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::drain", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashMap::extract_if", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::HashSet::iter", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::drain", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::extract_if", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::difference", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::symmetric_difference", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::intersection", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::HashSet::union", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::iter::IntoIterator::into_iter", reason = "CINV10: prevents HashMap/HashSet::into_iter() (for-loops over deterministic collections remain allowed)" },
]

disallowed-types = [
    { path = "std::collections::hash_map::Iter", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::IterMut", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::IntoIter", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::Keys", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::Values", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::ValuesMut", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::IntoKeys", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::IntoValues", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::Drain", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_map::ExtractIf", reason = "CINV10: hash-map iteration order is non-deterministic" },
    { path = "std::collections::hash_set::Iter", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::hash_set::IntoIter", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::hash_set::Drain", reason = "CINV10: hash-set iteration order is non-deterministic" },
    { path = "std::collections::hash_set::ExtractIf", reason = "CINV10: hash-set iteration order is non-deterministic" },
]
