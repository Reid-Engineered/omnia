[package]
name = "omnia-canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
omnia-doc = { path = "../omnia-doc" }
omnia-symbols = { path = "../omnia-symbols" }
omnia-theme = { path = "../omnia-theme" }

[dev-dependencies]
proptest = "1"
# Window::render_to_image and Window::set_scale_factor (G12), plus Window::rendered_scene
# for verifying glyph-atlas stability across repeated zoom sweeps (T3.1).
gpui = { workspace = true, features = ["test-support", "bench-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# gpui_platform defaults to headless-only on Linux unless a display backend is selected.
gpui_platform = { workspace = true, features = ["wayland"] }

[[test]]
name = "sheet_render"
harness = false

[[test]]
name = "sheet_text_render"
harness = false

[[test]]
name = "scale_factor"
harness = false
