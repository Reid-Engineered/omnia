[package]
name = "omnia-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Primitive and batch counts from Window::rendered_scene, which GPUI gates behind its
# bench-support feature. bench-support adds criterion and bench_metrics as normal GPUI
# dependencies, so it is opt-in: `cargo run --release -p omnia-bench --features scene-counts`.
scene-counts = ["gpui/bench-support"]
readback = ["gpui/test-support", "gpui_platform/test-support", "dep:resvg"]

[dependencies]
omnia-doc = { path = "../omnia-doc" }
omnia-symbols = { path = "../omnia-symbols" }
# profiler: Window::frame_duration_snapshot (G13).
gpui = { workspace = true, features = ["profiler"] }
gpui_platform.workspace = true
# Same major version and features as GPUI's, so FrameDurationSnapshot's histograms are this type.
hdrhistogram = { version = "7", default-features = false }
serde_json = "1"
# The real sheet element for `--sheet empty` (T1.6).
omnia-canvas = { path = "../omnia-canvas" }
omnia-theme = { path = "../omnia-theme" }

# resvg 0.46 (Apache-2.0 OR MIT), opt-in readback/reference only; never default.
resvg = { version = "0.46", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# gpui_platform defaults to headless-only on Linux unless a display backend is selected.
gpui_platform = { workspace = true, features = ["wayland"] }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "index"
harness = false

[[bench]]
name = "connectivity"
harness = false

[[bench]]
name = "command"
harness = false
