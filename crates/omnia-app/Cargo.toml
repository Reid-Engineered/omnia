[package]
name = "omnia-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
omnia-canvas = { path = "../omnia-canvas" }
omnia-doc = { path = "../omnia-doc" }
omnia-theme = { path = "../omnia-theme" }

[dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }

[[test]]
name = "fonts"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland"] }
