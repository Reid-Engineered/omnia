[package]
name = "omnia-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# mcp-plan.md section 5: no GPUI and no async runtime (AINV8, extends INV12).
[dependencies]
omnia-doc = { path = "../omnia-doc" }
# Symbol names, pins and bounds for the read projections (A1.4); GPUI-free (AINV8).
omnia-symbols = { path = "../omnia-symbols" }
# Canvas plan section 10 (MIT OR Apache-2.0); already in Cargo.lock.
serde = { version = "1", features = ["derive"] }
# Canvas plan section 10: the agent wire schema (MIT OR Apache-2.0); already in Cargo.lock.
serde_json = "1"
# Canvas plan section 10 (MIT OR Apache-2.0), already in Cargo.lock: preview ids and request
# hashes (mcp-plan.md sections 11.2 and 11.3, AQ10).
rustc-hash = "2"

[dev-dependencies]
proptest = "1"
